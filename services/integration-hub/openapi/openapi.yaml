openapi: 3.1.0
info:
  title: Integration Hub API
  version: 0.1.0
  description: >-
    Hub de integraciones: normaliza webhooks entrantes/salientes, mapeo, idempotencia, correlation_id, reintentos y estado de integraciones.
    Contrato preliminar (Fase 0). Se completará al diseñar el servicio.
servers:
  - url: /api/v1
    description: API propia del servicio
paths:
  /health:
    get:
      summary: Estado de salud del servicio
      operationId: getHealth
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: integration-hub }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 con tokens de mínimo privilegio.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes: {}
